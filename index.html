
<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Кофейня «Зёрна»</title>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

        }

        header {
            padding: 24px;
            text-align: center;
            background: #493329;
            color: white;
        }

        main {
            max-width: 700px;

        }

        p {

        <a class="button" href="mailto:hello@example.com">
